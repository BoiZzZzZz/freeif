[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# These two verify on Arc's Blockscout. Do not bump solc without re-checking verification.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[fmt]
line_length = 110

[invariant]
runs = 96
depth = 128
# Handler actions skip when there is nothing legal to do, so any revert is a real failure.
fail_on_revert = true
